name: SEO Release Gate v1.0

on:
  push:
    branches: [main]
  pull_request:

jobs:
  seo-release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Production Build
        run: pnpm run build

      - name: Run SEO Release Gate (Gate 17)
        env:
          NEXT_PUBLIC_SITE_URL: https://www.techjack.site
          SEO_GATE_BASE_URL: http://127.0.0.1:3000
        run: |
          pnpm run start -- --port 3000 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/robots.txt > /dev/null; then
              break
            fi
            sleep 1
          done
          node scripts/seo-gate.mjs
          GATE_EXIT=$?
          kill $SERVER_PID || true
          exit $GATE_EXIT
